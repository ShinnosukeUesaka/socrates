<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Socrates</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 300px; padding: 14px; }
      section { margin-top: 14px; }
      footer { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }
    </style>
  </head>
  <body>
    <div class="row">
      <h1><span class="flame">?</span> Socrates</h1>
      <label class="switch" title="Turn Socrates on or off">
        <input id="enabled" type="checkbox" aria-label="Enabled" />
        <span></span>
      </label>
    </div>
    <p class="muted" style="margin: 6px 0 0">Better thinking starts with awareness. Socrates reads only what you write.</p>

    <section>
      <h2>Drama level</h2>
      <div class="seg" id="intensity" role="group" aria-label="Drama level">
        <button type="button" data-value="subtle">Subtle</button>
        <button type="button" data-value="dramatic">Dramatic</button>
        <button type="button" data-value="maximum">Maximum</button>
      </div>
    </section>

    <section class="row">
      <span>Sound effects</span>
      <label class="switch">
        <input id="sound" type="checkbox" aria-label="Sound effects" />
        <span></span>
      </label>
    </section>

    <footer>
      <span class="pill"><span class="dot" id="engineDot"></span><span id="engine">…</span></span>
      <button type="button" id="settings">Settings</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
