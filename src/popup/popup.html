<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Socrates</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 300px; padding: 14px; }
      section { margin-top: 14px; }
      footer { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }
      .toggle { padding: 5px 0; }
    </style>
  </head>
  <body>
    <div class="row">
      <h1><span class="flame">?</span> Socrates</h1>
      <label class="switch" title="Turn Socrates on or off">
        <input id="enabled" type="checkbox" aria-label="Enabled" />
        <span></span>
      </label>
    </div>
    <p class="muted" style="margin: 6px 0 0">Read critically. Socrates questions the reasoning in what you read.</p>

    <p id="pageStatus" class="panel" style="margin: 12px 0 0; padding: 10px 12px">…</p>

    <section>
      <h2>Check</h2>
      <div class="row toggle"><span>Emails I open (Gmail)</span><label class="switch"><input data-setting="checkEmails" type="checkbox" aria-label="Emails I open" /><span></span></label></div>
      <div class="row toggle"><span>News &amp; articles</span><label class="switch"><input data-setting="checkArticles" type="checkbox" aria-label="News and articles" /><span></span></label></div>
      <div class="row toggle"><span>Google Docs</span><label class="switch"><input data-setting="checkDocs" type="checkbox" aria-label="Google Docs" /><span></span></label></div>
      <div class="row toggle"><span>What I write</span><label class="switch"><input data-setting="checkWriting" type="checkbox" aria-label="What I write" /><span></span></label></div>
      <button type="button" class="primary" id="checkPage" style="width: 100%; margin-top: 10px">Check this page now</button>
    </section>

    <section>
      <h2>Drama level</h2>
      <div class="seg" id="intensity" role="group" aria-label="Drama level">
        <button type="button" data-value="subtle">Subtle</button>
        <button type="button" data-value="dramatic">Dramatic</button>
        <button type="button" data-value="maximum">Maximum</button>
      </div>
    </section>

    <section class="row">
      <span>Sound effects</span>
      <label class="switch">
        <input id="sound" type="checkbox" aria-label="Sound effects" />
        <span></span>
      </label>
    </section>

    <footer>
      <span class="pill"><span class="dot" id="engineDot"></span><span id="engine">…</span></span>
      <button type="button" id="settings">Settings</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
