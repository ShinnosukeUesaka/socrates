<!doctype html>
<!-- A stand-in for an opened email in Gmail: the message body lives in div.a3s
     and contains the quoted earlier message in .gmail_quote. -->
<html>
<head>
<meta charset="utf-8">
<title>Account notice - Gmail</title>
<style>
  body { margin: 0; font: 14px/1.5 Arial, sans-serif; background: #f6f8fc; }
  .ii { max-width: 760px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 8px; }
  h2 { font-weight: normal; }
</style>
</head>
<body>
  <div class="nH">
    <h2 class="hP">Important: account notice</h2>
    <div class="ii gt">
      <div class="a3s aiL">
        <div>Dear customer,</div>
        <div><br></div>
        <div>We noticed unusual sign-in activity. Verify your account within 24 hours or your account will be suspended.</div>
        <div><br></div>
        <div>Thank you for banking with us.</div>
        <div class="gmail_quote">On Monday, Support wrote:<blockquote class="gmail_quote">Everyone knows our bank is the safest, prove me wrong.</blockquote></div>
      </div>
    </div>
  </div>
</body>
</html>
